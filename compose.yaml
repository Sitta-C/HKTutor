name: hktutor

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      CLERK_SECRET_KEY: '${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}'
      DATABASE_URL: '${DATABASE_URL:?DATABASE_URL is required}'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: '${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required}'
      NODE_ENV: production
      PORT: 3001
    ports:
      - '${API_PORT:-3001}:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/health').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: '${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required}'
    environment:
      CLERK_SECRET_KEY: '${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}'
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: '${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required}'
      NODE_ENV: production
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
