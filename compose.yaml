name: hktutor

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_URL: '${APP_URL:-http://localhost:3000}'
      COOKIE_DOMAIN: '${COOKIE_DOMAIN:-}'
      COOKIE_SAME_SITE: '${COOKIE_SAME_SITE:-lax}'
      COOKIE_SECURE: '${COOKIE_SECURE:-false}'
      DATABASE_URL: '${DATABASE_URL:?DATABASE_URL is required}'
      EMAIL_FROM: '${EMAIL_FROM:?EMAIL_FROM is required}'
      EMAIL_VERIFICATION_TTL_MINUTES: '${EMAIL_VERIFICATION_TTL_MINUTES:-60}'
      JWT_ACCESS_SECRET: '${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}'
      JWT_ACCESS_TTL_SECONDS: '${JWT_ACCESS_TTL_SECONDS:-900}'
      JWT_AUDIENCE: '${JWT_AUDIENCE:-hktutor-web}'
      JWT_ISSUER: '${JWT_ISSUER:-hktutor-api}'
      JWT_REFRESH_SECRET: '${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}'
      JWT_REFRESH_TTL_SECONDS: '${JWT_REFRESH_TTL_SECONDS:-604800}'
      NODE_ENV: production
      PORT: 3001
      RESEND_API_KEY: '${RESEND_API_KEY:?RESEND_API_KEY is required}'
      WEB_ORIGIN: '${WEB_ORIGIN:-http://localhost:3000}'
    ports:
      - '${API_PORT:-3001}:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/v1/health').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: '${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}'
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
