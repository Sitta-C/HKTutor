# Standalone reverse proxy behind the existing public TLS ingress. Set WEB_ORIGIN on the API
# to the exact public origin. Upstream names match compose.yaml.
events {}

# Nginx error lines can include the original URI; keep routine failures in the API's safe logs.
error_log /dev/stderr crit;

http {
    log_format hktutor '$request_method $uri $status';
    access_log /var/log/nginx/access.log hktutor;
    map $http_upgrade $chat_connection {
        default upgrade;
        '' close;
    }

    server {
        listen 80;

        location ^~ /api/v1/socket.io/ {
            proxy_pass http://api:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $chat_connection;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
        }

        location /api/v1/ {
            proxy_pass http://api:3001;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
