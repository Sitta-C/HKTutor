<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booking | HKTutor UI draft</title>
    <link rel="stylesheet" href="../shared/prototype.css" />
    <link rel="stylesheet" href="../../apps/web/src/app/globals.css" />
  </head>
  <body data-role="student">
    <div id="app"></div>
    <template id="page-content">
      <section class="proto-greeting">
        <p class="proto-eyebrow" data-en="Booking" data-th="การจอง">Booking</p>
        <h1 class="proto-title"><span data-en="Review your lesson request" data-th="ตรวจสอบคำขอเรียนของคุณ">Review your lesson request</span><span class="proto-role-chip" data-en="Student" data-th="นักเรียน">Student</span></h1>
        <p class="proto-subtitle" data-en="Choose one open time from the same tutor as the listing. A successful request reserves the slot and starts as Pending." data-th="เลือกหนึ่งช่วงเวลาว่างจากติวเตอร์คนเดียวกับคอร์ส เมื่อส่งสำเร็จระบบจะจองช่วงเวลาและเริ่มต้นด้วยสถานะรอยืนยัน">Choose one open time from the same tutor as the listing. A successful request reserves the slot and starts as Pending.</p>
      </section>

      <div class="proto-booking-layout" id="bookingReview">
        <section class="proto-card proto-panel">
          <div class="proto-section-head"><div><h2 data-en="Lesson details" data-th="รายละเอียดบทเรียน">Lesson details</h2><p data-en="Selected tutor and teaching listing" data-th="ติวเตอร์และคอร์สที่เลือก">Selected tutor and teaching listing</p></div><a class="proto-button-secondary" href="search.html" data-en="Change tutor" data-th="เปลี่ยนติวเตอร์">Change tutor</a></div>
          <div class="proto-section-body">
            <div class="proto-inline" style="align-items:flex-start;gap:1rem"><span class="proto-avatar" style="width:3.7rem;height:3.7rem">PS</span><div><div class="proto-inline" style="gap:.5rem;flex-wrap:wrap"><h3 class="proto-catalog-title">Pim S.</h3><span class="proto-pill role" data-en="VERIFIED" data-th="ยืนยันแล้ว">VERIFIED</span></div><div class="proto-meta" style="margin-top:.4rem"><span>★ 4.90 (24)</span><span data-en="6 years experience" data-th="ประสบการณ์ 6 ปี">6 years experience</span></div></div></div>
            <div class="proto-summary-box" style="margin-top:1rem"><p class="proto-summary-label" data-en="Selected listing" data-th="คอร์สที่เลือก">Selected listing</p><p class="proto-summary-value" data-en="Mathematics · Grade 10" data-th="คณิตศาสตร์ · มัธยมศึกษาปีที่ 4">Mathematics · Grade 10</p><p class="proto-description" data-en="Clear explanations, guided examples and exam-style practice tailored to your current level." data-th="อธิบายชัดเจน ฝึกตัวอย่างแบบมีขั้นตอน และโจทย์แนวข้อสอบที่เหมาะกับระดับของผู้เรียน">Clear explanations, guided examples and exam-style practice tailored to your current level.</p></div>
            <fieldset class="proto-fieldset" style="margin-top:1rem">
              <legend class="proto-legend" data-en="Choose an open time · Bangkok time (UTC+7)" data-th="เลือกช่วงเวลาว่าง · เวลาตามกรุงเทพฯ (UTC+7)">Choose an open time · Bangkok time (UTC+7)</legend>
              <div class="proto-booking-options" style="margin-top:.8rem">
                <label class="proto-booking-option">
                  <input type="radio" name="slot" value="first" checked />
                  <span class="proto-booking-option-copy"><strong data-en="Thursday, 10 September" data-th="วันพฤหัสบดี 10 กันยายน">Thursday, 10 September</strong><span>10:00–11:00 · <span data-en="1 hour" data-th="1 ชั่วโมง">1 hour</span></span></span>
                  <span class="proto-pill open" data-en="OPEN" data-th="ว่าง">OPEN</span>
                </label>
                <label class="proto-booking-option">
                  <input type="radio" name="slot" value="second" />
                  <span class="proto-booking-option-copy"><strong data-en="Saturday, 12 September" data-th="วันเสาร์ 12 กันยายน">Saturday, 12 September</strong><span>09:00–10:00 · <span data-en="1 hour" data-th="1 ชั่วโมง">1 hour</span></span></span>
                  <span class="proto-pill open" data-en="OPEN" data-th="ว่าง">OPEN</span>
                </label>
                <label class="proto-booking-option">
                  <input type="radio" name="slot" value="third" />
                  <span class="proto-booking-option-copy"><strong data-en="Saturday, 12 September" data-th="วันเสาร์ 12 กันยายน">Saturday, 12 September</strong><span>13:00–15:00 · <span data-en="2 hours" data-th="2 ชั่วโมง">2 hours</span></span></span>
                  <span class="proto-pill open" data-en="OPEN" data-th="ว่าง">OPEN</span>
                </label>
              </div>
            </fieldset>
            <div class="proto-notice" style="margin-top:1rem"><strong data-en="Request, not confirmation" data-th="นี่คือคำขอ ไม่ใช่การยืนยัน">Request, not confirmation</strong><br /><span data-en="Submitting creates a Pending booking. Tutor confirmation is a later booking action." data-th="เมื่อส่งแล้วจะสร้างการจองสถานะรอยืนยัน การตอบรับจากติวเตอร์เป็นขั้นตอนภายหลัง">Submitting creates a Pending booking. Tutor confirmation is a later booking action.</span></div>
          </div>
        </section>

        <aside class="proto-card proto-panel proto-preview">
          <div class="proto-section-head"><div><h2 data-en="Booking summary" data-th="สรุปการจอง">Booking summary</h2><p data-en="Amounts are confirmed by the server." data-th="ยอดเงินยืนยันโดยเซิร์ฟเวอร์">Amounts are confirmed by the server.</p></div></div>
          <div class="proto-section-body">
            <div class="proto-summary-box"><p class="proto-summary-label" data-en="Lesson time" data-th="เวลาเรียน">Lesson time</p><p class="proto-summary-value" id="selectedTime" data-en="Thursday 10 Sep 2026 · 10:00–11:00" data-th="วันพฤหัสบดี 10 ก.ย. 2569 · 10:00–11:00">Thursday 10 Sep 2026 · 10:00–11:00</p><p class="proto-help" data-en="Bangkok time (UTC+7) · 1 hour" data-th="เวลาตามกรุงเทพฯ (UTC+7) · 1 ชั่วโมง">Bangkok time (UTC+7) · 1 hour</p></div>
            <div style="margin-top:1rem"><div class="proto-money-row"><span data-en="Hourly rate" data-th="ราคาต่อชั่วโมง">Hourly rate</span><strong>450.00฿</strong></div><div class="proto-money-row"><span data-en="Lesson duration" data-th="ระยะเวลาบทเรียน">Lesson duration</span><strong id="duration" data-en="1 hour" data-th="1 ชั่วโมง">1 hour</strong></div><div class="proto-money-row"><span data-en="Subtotal" data-th="ยอดก่อนส่วนลด">Subtotal</span><strong id="subtotal">450.00฿</strong></div><div class="proto-money-row"><span data-en="Discount" data-th="ส่วนลด">Discount</span><strong>0.00฿</strong></div><div class="proto-money-row total"><span data-en="Request total" data-th="ยอดคำขอจอง">Request total</span><strong id="net">450.00 THB</strong></div></div>
            <button class="proto-button-amber" id="submitBooking" type="button" style="width:100%;margin-top:1.1rem"><span data-en="Send booking request" data-th="ส่งคำขอจอง">Send booking request</span></button>
            <button class="proto-text-button" id="simulateConflict" type="button" style="width:100%;margin-top:.6rem" data-en="Preview unavailable-slot state" data-th="ดูตัวอย่างเมื่อช่วงเวลาถูกจอง">Preview unavailable-slot state</button>
            <div class="proto-error-box proto-hidden" id="bookingConflict" style="margin-top:.8rem"><strong data-en="This time was just booked" data-th="ช่วงเวลานี้เพิ่งถูกจอง">This time was just booked</strong><p data-en="Choose another open time. The latest availability has been reloaded." data-th="กรุณาเลือกช่วงเวลาอื่น ระบบโหลดเวลาว่างล่าสุดให้แล้ว">Choose another open time. The latest availability has been reloaded.</p></div>
            <p class="proto-help" style="margin-top:.65rem;text-align:center" data-en="Student identity and price snapshot are set by the server." data-th="ตัวตนนักเรียนและยอดเงิน ณ เวลาจองกำหนดโดยเซิร์ฟเวอร์">Student identity and price snapshot are set by the server.</p>
          </div>
        </aside>
      </div>

      <section class="proto-card proto-panel proto-hidden" id="bookingSuccess">
        <div class="proto-success"><strong data-en="Booking request sent" data-th="ส่งคำขอจองแล้ว">Booking request sent</strong><p style="margin-top:.35rem" data-en="Your request was created as Pending. The selected time is now reserved." data-th="สร้างคำขอด้วยสถานะรอยืนยันแล้ว และช่วงเวลาที่เลือกถูกจองไว้">Your request was created as Pending. The selected time is now reserved.</p></div>
        <div class="proto-grid-3" style="margin-top:1rem"><div class="proto-summary-box"><p class="proto-summary-label" data-en="Status" data-th="สถานะ">Status</p><p class="proto-summary-value"><span class="proto-pill pending" data-en="PENDING" data-th="รอยืนยัน">PENDING</span></p></div><div class="proto-summary-box"><p class="proto-summary-label" data-en="Tutor and subject" data-th="ติวเตอร์และวิชา">Tutor and subject</p><p class="proto-summary-value" data-en="Pim S. · Mathematics · Grade 10" data-th="Pim S. · คณิตศาสตร์ · มัธยมศึกษาปีที่ 4">Pim S. · Mathematics · Grade 10</p></div><div class="proto-summary-box"><p class="proto-summary-label" data-en="Amount snapshot" data-th="ยอดเงินที่บันทึก">Amount snapshot</p><p class="proto-summary-value">450.00 THB</p></div></div>
        <div class="proto-actions"><button class="proto-button" id="viewBookings" type="button" data-en="View my bookings" data-th="ดูการจองของฉัน">View my bookings</button><a class="proto-button-secondary" href="search.html" data-en="Find another tutor" data-th="ค้นหาติวเตอร์เพิ่ม">Find another tutor</a></div>
      </section>

      <section class="proto-card proto-panel" style="margin-top:1.2rem" id="bookings">
        <div class="proto-section-head"><div><h2 data-en="My bookings" data-th="การจองของฉัน">My bookings</h2><p data-en="Four own records shown in Bangkok time." data-th="แสดงการจองของฉัน 4 รายการตามเวลาประเทศไทย">Four own records shown in Bangkok time.</p></div><div class="proto-tabs" aria-label="Booking status filter"><button class="proto-tab active" type="button" data-filter="all" data-en="All 4" data-th="ทั้งหมด 4">All 4</button><button class="proto-tab" type="button" data-filter="pending" data-en="Pending 1" data-th="รอยืนยัน 1">Pending 1</button><button class="proto-tab" type="button" data-filter="confirmed" data-en="Confirmed 1" data-th="ยืนยันแล้ว 1">Confirmed 1</button><button class="proto-tab" type="button" data-filter="completed" data-en="Completed 1" data-th="เสร็จสิ้น 1">Completed 1</button><button class="proto-tab" type="button" data-filter="canceled" data-en="Canceled 1" data-th="ยกเลิก 1">Canceled 1</button></div></div>
        <div class="proto-list proto-section-body" id="bookingRows">
          <article class="proto-row" data-status="pending"><span class="proto-avatar">PS</span><div class="proto-row-copy"><b data-en="Pim S. · Mathematics · Grade 10" data-th="Pim S. · คณิตศาสตร์ · มัธยมศึกษาปีที่ 4">Pim S. · Mathematics · Grade 10</b><span data-en="Thu 10 Sep 2026 · 10:00–11:00 · 450.00 THB" data-th="พฤ. 10 ก.ย. 2569 · 10:00–11:00 · 450.00 บาท">Thu 10 Sep 2026 · 10:00–11:00 · 450.00 THB</span></div><span class="proto-pill pending" data-en="PENDING" data-th="รอยืนยัน">PENDING</span><button class="proto-button-secondary" type="button" data-en="View" data-th="ดู">View</button></article>
          <article class="proto-row" data-status="confirmed"><span class="proto-avatar">AM</span><div class="proto-row-copy"><b data-en="Anan M. · Mathematics · Grade 10" data-th="Anan M. · คณิตศาสตร์ · มัธยมศึกษาปีที่ 4">Anan M. · Mathematics · Grade 10</b><span data-en="Thu 10 Sep 2026 · 16:00–17:00 · 500.00 THB" data-th="พฤ. 10 ก.ย. 2569 · 16:00–17:00 · 500.00 บาท">Thu 10 Sep 2026 · 16:00–17:00 · 500.00 THB</span></div><span class="proto-pill confirmed" data-en="CONFIRMED" data-th="ยืนยันแล้ว">CONFIRMED</span><button class="proto-button-secondary" type="button" data-en="View" data-th="ดู">View</button></article>
          <article class="proto-row" data-status="completed"><span class="proto-avatar">PS</span><div class="proto-row-copy"><b data-en="Pim S. · Mathematics · Grade 9" data-th="Pim S. · คณิตศาสตร์ · มัธยมศึกษาปีที่ 3">Pim S. · Mathematics · Grade 9</b><span data-en="Sat 29 Aug 2026 · 09:00–10:00 · 350.00 THB" data-th="ส. 29 ส.ค. 2569 · 09:00–10:00 · 350.00 บาท">Sat 29 Aug 2026 · 09:00–10:00 · 350.00 THB</span></div><span class="proto-pill" data-en="COMPLETED" data-th="เสร็จสิ้น">COMPLETED</span><button class="proto-button-secondary" type="button" data-en="View" data-th="ดู">View</button></article>
          <article class="proto-row" data-status="canceled"><span class="proto-avatar">MK</span><div class="proto-row-copy"><b data-en="Mali K. · English · Grade 11" data-th="Mali K. · ภาษาอังกฤษ · มัธยมศึกษาปีที่ 5">Mali K. · English · Grade 11</b><span data-en="Tue 25 Aug 2026 · 18:00–19:00 · 350.00 THB" data-th="อ. 25 ส.ค. 2569 · 18:00–19:00 · 350.00 บาท">Tue 25 Aug 2026 · 18:00–19:00 · 350.00 THB</span></div><span class="proto-pill canceled" data-en="CANCELED" data-th="ยกเลิก">CANCELED</span><button class="proto-button-secondary" type="button" data-en="View" data-th="ดู">View</button></article>
        </div>
      </section>

    </template>
    <script src="../shared/prototype-shell.js"></script>
    <script>
      HKTutorPrototype.mount({ role: 'student', active: 'bookings', headerSecondary: { en: 'Find a tutor', th: 'ค้นหาติวเตอร์', href: 'search.html' }, headerPrimary: { en: 'My bookings', th: 'การจองของฉัน', href: '#bookings' } });
      const slots = {
        first: { en: 'Thursday 10 Sep 2026 · 10:00–11:00', th: 'วันพฤหัสบดี 10 ก.ย. 2569 · 10:00–11:00', hours: 1 },
        second: { en: 'Saturday 12 Sep 2026 · 09:00–10:00', th: 'วันเสาร์ 12 ก.ย. 2569 · 09:00–10:00', hours: 1 },
        third: { en: 'Saturday 12 Sep 2026 · 13:00–15:00', th: 'วันเสาร์ 12 ก.ย. 2569 · 13:00–15:00', hours: 2 },
      };
      document.querySelectorAll('input[name="slot"]').forEach((radio) => radio.addEventListener('change', () => {
        const slot = slots[radio.value];
        const hours = slot.hours;
        const selectedTime = document.getElementById('selectedTime');
        const duration = document.getElementById('duration');
        selectedTime.dataset.en = slot.en;
        selectedTime.dataset.th = slot.th;
        duration.dataset.en = `${hours} hour${hours === 1 ? '' : 's'}`;
        duration.dataset.th = `${hours} ชั่วโมง`;
        document.getElementById('subtotal').textContent = `${(450 * hours).toFixed(2)}฿`;
        document.getElementById('net').textContent = `${(450 * hours).toFixed(2)} THB`;
        HKTutorPrototype.applyLanguage();
      }));
      document.getElementById('submitBooking').addEventListener('click', () => {
        document.getElementById('bookingReview').classList.add('proto-hidden');
        document.getElementById('bookingSuccess').classList.remove('proto-hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        HKTutorPrototype.toast('Booking created as Pending', 'สร้างการจองสถานะรอยืนยันแล้ว');
      });
      document.getElementById('simulateConflict').addEventListener('click', () => {
        document.getElementById('bookingConflict').classList.remove('proto-hidden');
        document.querySelector('input[name="slot"]:checked').closest('label').classList.add('proto-unavailable');
        HKTutorPrototype.toast('Availability refreshed', 'โหลดเวลาว่างล่าสุดแล้ว');
      });
      document.getElementById('viewBookings').addEventListener('click', () => document.getElementById('bookings').scrollIntoView({ behavior: 'smooth' }));
      document.querySelectorAll('.proto-tab').forEach((tab) => tab.addEventListener('click', () => {
        document.querySelectorAll('.proto-tab').forEach((item) => item.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('#bookingRows [data-status]').forEach((row) => row.classList.toggle('proto-hidden', tab.dataset.filter !== 'all' && row.dataset.status !== tab.dataset.filter));
      }));
    </script>
  </body>
</html>
